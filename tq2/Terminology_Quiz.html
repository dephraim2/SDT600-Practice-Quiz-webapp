                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                return indices;
            },

            startTimer() {

                this.state.timerInterval = setInterval(() => {

                    if (this.state.timeRemaining <= 0) {

            },

                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                this.state.totalPoints = 0;
                this.state.answers = new Array(this.questions.length).fill(null);
                this.state.timeRemaining = 3600;
                this.state.questionOrder = this.getRandomizedQuestions();
                clearInterval(this.state.timerInterval);
                this.startTimer();
                this.render();
            },

            selectAnswer(optionIndex) {
                if (this.state.currentScreen !== 'quiz') return;

                const qIndex = this.state.questionOrder[this.state.currentQuestion];
                const question = this.questions[qIndex];

                if (question.type === 'mc-multi') {
                    if (!this.state.answers[qIndex]) {
                        this.state.answers[qIndex] = [];
                    }
                    if (this.state.answers[qIndex].includes(optionIndex)) {
                        this.state.answers[qIndex] = this.state.answers[qIndex].filter(i => i !== optionIndex);
                    } else {
                        this.state.answers[qIndex].push(optionIndex);
                    }
                } else {
                    this.state.answers[qIndex] = optionIndex;
                }
                this.render();
            },

            submitAnswer() {
                const qIndex = this.state.questionOrder[this.state.currentQuestion];
                const question = this.questions[qIndex];
                const answer = this.state.answers[qIndex];

                let isCorrect = false;
                if (question.type === 'mc-multi') {
                    isCorrect = answer && Array.isArray(answer) &&
                               answer.length === question.correct.length &&
                               answer.every(a => question.correct.includes(a));
                } else if (question.type === 'tf') {
                    isCorrect = answer === question.correct[0];
                } else {
                    isCorrect = answer === question.correct[0];
                }

                if (isCorrect) {
                    this.state.score += 1;
                }
                this.state.totalPoints += 1;

                this.state.currentScreen = 'feedback';
                this.state.answers[qIndex] = answer;
                this.render();
            },

            nextQuestion() {
                if (this.state.currentQuestion < this.questions.length - 1) {
                    this.state.currentQuestion++;
                    this.state.currentScreen = 'quiz';
                    this.render();
                } else {
                    this.finishQuiz();
                }
            },

            finishQuiz() {
                clearInterval(this.state.timerInterval);
                this.state.currentScreen = 'results';
                this.render();
            },

            restart() {
                this.state.currentScreen = 'intro';
                this.init();
            },

            render() {
                const app = document.getElementById('app');

                if (this.state.currentScreen === 'intro') {
                    app.innerHTML = this.renderIntro();
                } else if (this.state.currentScreen === 'quiz') {
                    app.innerHTML = this.renderQuiz();
                } else if (this.state.currentScreen === 'feedback') {
                    app.innerHTML = this.renderFeedback();
                } else if (this.state.currentScreen === 'results') {
                    app.innerHTML = this.renderResults();
                }
            },

            renderIntro() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 flex items-center justify-center p-4">
                        <div class="max-w-2xl w-full bg-white rounded-lg shadow-2xl p-8 md:p-12 fade-in">
                            <div class="text-center mb-8">
                                <h1 class="text-4xl font-bold text-teal-600 mb-2">SDT600</h1>
                                <p class="text-2xl text-gray-700">Terminology & Definitions Quiz</p>
                                <p class="text-gray-500 mt-2">Foundation Knowledge Assessment</p>
                            </div>

                            <div class="space-y-6 mb-8">
                                <div class="bg-teal-50 p-6 rounded-lg">
                                    <h3 class="font-bold text-lg text-teal-600 mb-3">📚 Quiz Details</h3>
                                    <ul class="space-y-2 text-gray-700">
                                        <li><strong>Total Questions:</strong> 60 questions</li>
                                        <li><strong>Focus:</strong> Key terminologies and definitions</li>
                                        <li><strong>Question Types:</strong>
                                            <ul class="ml-6 text-sm mt-1">
                                                <li>• Multiple Choice (single & multi-select)</li>
                                                <li>• True/False</li>
                                                <li>• Definition Scenarios</li>
                                            </ul>
                                        </li>
                                        <li><strong>Time Limit:</strong> 60 minutes</li>
                                        <li><strong>Points:</strong> 1 point per question</li>
                                    </ul>
                                </div>

                                <div class="bg-green-50 p-6 rounded-lg">
                                    <h3 class="font-bold text-lg text-green-600 mb-3">🎯 Topics Covered</h3>
                                    <ul class="space-y-1 text-gray-700 text-sm">
                                        <li>✓ Project, Program, Portfolio definitions</li>
                                        <li>✓ Project/Program/Portfolio Management</li>
                                        <li>✓ Digital Strategy vs Business Strategy</li>
                                        <li>✓ IS vs IT - distinctions</li>
                                        <li>✓ Governance & Strategic Alignment</li>
                                        <li>✓ Business Processes & BPM</li>
                                        <li>✓ Earned Value, Scope, Baselines</li>
                                        <li>✓ Stakeholders, Change Management</li>
                                        <li>✓ Risk, Maturity Models, Modernization</li>
                                    </ul>
                                </div>

                                <div class="bg-blue-50 p-6 rounded-lg">
                                    <h3 class="font-bold text-lg text-blue-600 mb-3">✅ Purpose</h3>
                                    <p class="text-gray-700 text-sm">
                                        Master foundational terminologies and definitions. This quiz ensures you understand core concepts before applying them in scenarios.
                                    </p>
                                </div>
                            </div>

                            <div class="border-t pt-6">
                                <button onclick="QuizApp.startQuiz()"
                                    class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                                    Start Terminology Quiz
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderQuiz() {
                const qIndex = this.state.questionOrder[this.state.currentQuestion];
                const question = this.questions[qIndex];
                const progress = ((this.state.currentQuestion + 1) / this.questions.length) * 100;
                const timeColor = this.state.timeRemaining < 300 ? 'text-red-600 timer-danger' : 'text-gray-600';

                let questionContent = '';

                if (question.type === 'mc-single' || question.type === 'mc-multi') {
                    const isMulti = question.type === 'mc-multi';
                    questionContent = `
                        <div class="space-y-3">
                            ${question.options.map((option, idx) => `
                                <label class="flex items-start p-4 border-2 border-gray-200 rounded-lg hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition"
                                    onclick="event.stopPropagation()">
                                    <input type="checkbox" ${isMulti ? '' : 'name="answer"'}
                                        ${this.state.answers[qIndex] && (isMulti ? this.state.answers[qIndex].includes(idx) : this.state.answers[qIndex] === idx) ? 'checked' : ''}
                                        onchange="QuizApp.selectAnswer(${idx})"
                                        class="w-5 h-5 text-teal-600 rounded mt-1 flex-shrink-0">
                                    <span class="ml-4 text-gray-700">${option}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                } else if (question.type === 'tf') {
                    questionContent = `
                        <div class="space-y-3">
                            ${question.options.map((option, idx) => `
                                <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition"
                                    onclick="event.stopPropagation()">
                                    <input type="radio" name="answer"
                                        ${this.state.answers[qIndex] === idx ? 'checked' : ''}
                                        onchange="QuizApp.selectAnswer(${idx})"
                                        class="w-5 h-5 text-teal-600">
                                    <span class="ml-4 text-gray-700 text-lg font-semibold">${option}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                } else if (question.type === 'scenario') {
                    questionContent = `
                        <div class="space-y-3">
                            ${question.options.map((option, idx) => `
                                <label class="flex items-start p-4 border-2 border-gray-200 rounded-lg hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition"
                                    onclick="event.stopPropagation()">
                                    <input type="radio" name="answer"
                                        ${this.state.answers[qIndex] === idx ? 'checked' : ''}
                                        onchange="QuizApp.selectAnswer(${idx})"
                                        class="w-5 h-5 text-teal-600 mt-1 flex-shrink-0">
                                    <span class="ml-4 text-gray-700">${option}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                }

                return `
                    <div class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 p-4">
                        <div class="max-w-3xl mx-auto">
                            <!-- Header -->
                            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                                <div class="flex justify-between items-center mb-4">
                                    <h1 class="text-2xl font-bold text-teal-600">Terminology Quiz</h1>
                                    <div class="text-right">
                                        <div class="text-3xl font-bold" data-timer>${this.formatTime(this.state.timeRemaining)}</div>
                                        <p class="text-sm text-gray-600">Time Remaining</p>
                                    </div>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-3">
                                    <div class="progress-bar bg-teal-600 h-3 rounded-full" style="width: ${progress}%"></div>
                                </div>
                                <p class="text-sm text-gray-600 mt-2">Question ${this.state.currentQuestion + 1} of ${this.questions.length}</p>
                            </div>

                            <!-- Question -->
                            <div class="bg-white rounded-lg shadow-md p-8">
                                <p class="text-lg font-semibold text-gray-800 mb-6">${question.question}</p>
                                ${questionContent}

                                <div class="mt-8 flex gap-4">
                                    <button onclick="QuizApp.submitAnswer()"
                                        class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                                        Submit Answer
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderFeedback() {
                const qIndex = this.state.questionOrder[this.state.currentQuestion];
                const question = this.questions[qIndex];
                const answer = this.state.answers[qIndex];

                let isCorrect = false;
                if (question.type === 'mc-multi') {
                    isCorrect = answer && Array.isArray(answer) &&
                               answer.length === question.correct.length &&
                               answer.every(a => question.correct.includes(a));
                } else {
                    isCorrect = answer === question.correct[0];
                }

                const answerText = question.type === 'mc-multi'
                    ? `[${answer ? answer.map(i => question.options[i]).join(', ') : 'Not answered'}]`
                    : question.options[answer] || 'Not answered';

                const correctText = question.type === 'mc-multi'
                    ? `[${question.correct.map(i => question.options[i]).join(', ')}]`
                    : question.options[question.correct[0]];

                return `
                    <div class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 p-4">
                        <div class="max-w-3xl mx-auto">
                            <!-- Header -->
                            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                                <div class="flex justify-between items-center">
                                    <h1 class="text-2xl font-bold text-teal-600">Terminology Quiz</h1>
                                    <div class="text-right">
                                        <div class="text-3xl font-bold text-gray-600" data-timer>${this.formatTime(this.state.timeRemaining)}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Feedback -->
                            <div class="bg-white rounded-lg shadow-md p-8">
                                <div class="mb-6 p-4 rounded-lg ${isCorrect ? 'bg-green-100 border-l-4 border-green-500' : 'bg-red-100 border-l-4 border-red-500'}">
                                    <p class="text-lg font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">
                                        ${isCorrect ? '✓ Correct!' : '✗ Incorrect'}
                                    </p>
                                </div>

                                <div class="space-y-6">
                                    <div>
                                        <p class="font-semibold text-gray-700">Question:</p>
                                        <p class="text-gray-600 mt-2">${question.question}</p>
                                    </div>

                                    <div>
                                        <p class="font-semibold text-gray-700">Your Answer:</p>
                                        <p class="text-gray-600 mt-1 ${isCorrect ? 'text-green-700' : 'text-red-700'}">${answerText}</p>
                                    </div>

                                    ${!isCorrect ? `
                                        <div>
                                            <p class="font-semibold text-gray-700">Correct Answer:</p>
                                            <p class="text-gray-600 mt-1 text-green-700">${correctText}</p>
                                        </div>
                                    ` : ''}

                                    <div class="bg-teal-50 p-4 rounded-lg">
                                        <p class="font-semibold text-gray-700 mb-2">💡 Explanation:</p>
                                        <p class="text-gray-700">${question.explanation}</p>
                                    </div>
                                </div>

                                <div class="mt-8">
                                    <button onclick="QuizApp.nextQuestion()"
                                        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                                        ${this.state.currentQuestion === this.questions.length - 1 ? 'View Results' : 'Next Question'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderResults() {
                const percentage = Math.round((this.state.score / this.state.totalPoints) * 100);
                const correctCount = this.state.score;
                const wrongCount = this.state.totalPoints - this.state.score;

                return `
                    <div class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 flex items-center justify-center p-4">
                        <div class="max-w-2xl w-full bg-white rounded-lg shadow-2xl p-8 md:p-12 fade-in">
                            <div class="text-center mb-8">
                                <div class="text-6xl font-bold text-teal-600 mb-4">
                                    ${percentage >= 75 ? '🌟' : percentage >= 60 ? '✓' : '📚'}
                                </div>
                                <h1 class="text-4xl font-bold text-gray-800 mb-2">
                                    ${percentage >= 75 ? 'Excellent Understanding!' : percentage >= 60 ? 'Good Grasp!' : 'Keep Studying!'}
                                </h1>
                            </div>

                            <div class="space-y-6 mb-8">
                                <div class="bg-teal-50 p-6 rounded-lg text-center">
                                    <p class="text-gray-600 font-semibold mb-2">Final Score</p>
                                    <p class="text-5xl font-bold text-teal-600">${percentage}%</p>
                                    <p class="text-gray-600 text-sm mt-2">${this.state.score} out of ${this.state.totalPoints} points</p>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-green-50 p-6 rounded-lg text-center">
                                        <p class="text-gray-600 font-semibold mb-2">Correct</p>
                                        <p class="text-4xl font-bold text-green-600">${correctCount}</p>
                                    </div>
                                    <div class="bg-red-50 p-6 rounded-lg text-center">
                                        <p class="text-gray-600 font-semibold mb-2">Incorrect</p>
                                        <p class="text-4xl font-bold text-red-600">${wrongCount}</p>
                                    </div>
                                </div>

                                <div class="bg-indigo-50 p-6 rounded-lg">
                                    <p class="font-semibold text-indigo-800 mb-2">📖 Key Takeaway</p>
                                    <p class="text-gray-700 text-sm">
                                        ${percentage >= 75 ? 'Strong terminology foundation! You\'re well-prepared for application questions.' : percentage >= 60 ? 'Review the areas you struggled with before moving to application scenarios.' : 'Focus on foundational definitions. Review all terminology before proceeding.'}
                                    </p>
                                </div>
                            </div>

                            <button onclick="QuizApp.restart()"
                                class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                                Retake Quiz
                            </button>
                        </div>
                    </div>
                `;
            }
        };

        // Initialize app
        QuizApp.init();
    </script>
</body>
</html>
